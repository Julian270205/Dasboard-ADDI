# Corre en cada Pull Request (hacia develop o main) y en cada push a develop y main.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  datos:
    name: Generador (replicable y sin cambios sin commitear)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Generar dos veces, validar y comparar con db/
        working-directory: generador
        run: python generar.py
      - name: Los scripts SQL commiteados son los que produce el generador
        run: git diff --exit-code db/ generador/huella.txt

  api:
    runs-on: ubuntu-latest
    needs: datos
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: addi_api
          POSTGRES_PASSWORD: addi
          POSTGRES_DB: addi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U addi_api" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://addi_api:addi@localhost:5432/addi
      JWT_SECRET: ci
      API_INTERNAL_TOKEN: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Pruebas (carga los datos de db/ en PostgreSQL)
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Tipos y build
        run: npm run build

  n8n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Los flujos son JSON válido y no traen credenciales
        run: |
          for f in n8n/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            if grep -qiE '"(password|apiKey|token|credentials)"\s*:\s*["{]' "$f"; then echo "Posible secreto en $f"; exit 1; fi
          done
