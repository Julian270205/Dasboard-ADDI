# Dashboard estratégico de TI de Addi: stack completo (datos y reglas de la v1 + API + n8n + React).
#
# En la EC2 (capa gratuita, 1 GB de RAM) NUNCA se construye nada:
#   docker compose pull && docker compose up -d --no-build
# Las imágenes las construye GitHub Actions y las publica en GHCR.
# En local se construye con el archivo extra:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# Presupuesto de memoria (más 2 GB de swap en el host):
#   postgres 256 MB · api 256 MB · n8n 384 MB · web (Caddy) 64 MB  ≈ 960 MB

name: addi-dashboard

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD:?Falta POSTGRES_SUPERPASSWORD}
      APP_DB: ${APP_DB:-addi}
      APP_DB_USER: ${APP_DB_USER:-addi_api}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Falta APP_DB_PASSWORD}
      N8N_DB: ${N8N_DB:-n8n}
      N8N_DB_USER: ${N8N_DB_USER:-n8n}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Falta N8N_DB_PASSWORD}
    # Ajustes para poca memoria
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=128MB
      -c max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]
    # Sin "ports": PostgreSQL no se publica.

  api:
    image: ${REGISTRY:-ghcr.io/julian270205/dasboard-addi}/api:${TAG:-latest}
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-addi_api}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB:-addi}
      N8N_WEBHOOK_AVISOS: http://n8n:5678/webhook/addi-avisos
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Falta N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      # Poda de ejecuciones para cuidar disco y memoria
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "2000"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=320
      # Variables que lee el flujo (n8n no tiene credenciales de la base addi)
      API_INTERNAL_BASE: http://api:8000/api/v1/internal
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:?Falta API_INTERNAL_TOKEN}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-tablero@addi.demo}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8ndata:/home/node/.n8n
    # El editor NO se publica. Se usa por túnel SSH:
    #   ssh -L 5678:localhost:5678 ubuntu@<ip-ec2>
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  web:
    # Caddy con el frontend ya compilado dentro de la imagen.
    image: ${REGISTRY:-ghcr.io/julian270205/dasboard-addi}/web:${TAG:-latest}
    restart: unless-stopped
    mem_limit: 64m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api]
    networks: [interna]

volumes:
  pgdata:
  n8ndata:
  caddydata:
  caddyconfig:

networks:
  interna:
