<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Addi · Dashboard estratégico de TI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f5f2;--card:#fff;--line:#e4e1da;--line2:#ece9e2;--tx:#1f2328;--mut:#5b616a;--mut2:#8a9099;--acc:#1f5fbf;
--verde:#1a7f4b;--amarillo:#b7791f;--rojo:#c0392b;--gris:#8a9099}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45}
button,input,select{font-family:inherit;font-size:13px;color:var(--tx)}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 32px 0;position:sticky;top:0;z-index:20}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.brand b{font-size:20px;font-weight:600;letter-spacing:-.01em}.brand span{font-size:14px;color:var(--mut);margin-left:12px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn,.ctl select,.ctl input{background:#fff;border:1px solid #d6d2c9;border-radius:8px;padding:8px 12px;min-height:38px}
.btn{cursor:pointer}.btn:hover{background:#faf9f6}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{min-height:30px;padding:4px 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--mut);margin-top:10px;align-items:center}
.cnt{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--tx)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;font-size:14px;color:var(--mut);cursor:pointer;min-height:44px;display:flex;gap:8px;align-items:center}
.tab.on{border-bottom-color:var(--acc);font-weight:600;color:var(--tx)}
.badge{background:var(--acc);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:600}
main{padding:24px 32px 48px;display:flex;flex-direction:column;gap:28px;max-width:1500px;margin:0 auto}
.sec h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}.sec .sub{font-size:13px;color:var(--mut);margin-bottom:14px}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:15px;font-weight:600;margin:0}.card .d{font-size:13px;color:var(--mut)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;white-space:nowrap}
.t-Real{background:#e7f0e9;color:#14532d}.t-Estimado{background:#e8edf7;color:#1e3a8a}.t-Simulado{background:#f1e8f5;color:#581c87}.t-Por{background:#ece9e2;color:#5b616a}
.t-ev{background:#fff;border:1px solid #d6d2c9;color:var(--mut)}
.num{font-size:12px;color:var(--mut);white-space:nowrap}
.kpi{cursor:pointer;gap:8px;padding:16px}.kpi:hover{border-color:#b9b5aa}.kpi:focus-visible{outline:2px solid var(--acc)}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.02em}.kpi .u{font-size:12px;color:var(--mut);margin-left:4px;font-weight:400}
.kpi .n{font-size:13px;font-weight:500}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--mut);flex-wrap:wrap}
.sem{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600}
.big{font-size:40px;font-weight:600;letter-spacing:-.03em}
table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-weight:500;color:var(--mut);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}tr:last-child td{border-bottom:none}
tr.clk{cursor:pointer}tr.clk:hover td{background:#faf9f6}
.scroll{overflow-x:auto}
.bar{height:10px;background:var(--line2);border-radius:5px;position:relative;min-width:60px}.bar i{display:block;height:10px;border-radius:5px;background:var(--acc)}
.bar em{position:absolute;top:-3px;width:2px;height:16px;background:var(--tx)}
.note{font-size:12px;color:var(--mut)}
.banner{background:#fff8e6;border:1px solid #ecd9a4;border-radius:10px;padding:10px 14px;font-size:13px;color:#6b4e0b}
.banner.ok{background:#e7f0e9;border-color:#bcd6c3;color:#14532d}
.cell{border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;border:2px solid transparent;font-size:12px;font-weight:600;min-width:62px}
.cell small{display:block;font-weight:400;font-size:11px;opacity:.9}.cell.sel{border-color:var(--tx)}
.dom{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.dom>b{width:44px;font-size:13px}
.pers{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:stretch;margin-bottom:10px}
.pers>.pl{border-radius:10px;padding:12px;font-weight:600;font-size:13px;display:flex;align-items:center;background:#e8edf7;color:#1e3a8a}
.objs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.obj{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;font-size:13px;display:flex;flex-direction:column;gap:6px}
.obj .c{font-size:11px;color:var(--mut)}
.ind{display:flex;gap:6px;align-items:center;font-size:12px;cursor:pointer;padding:2px 0}.ind:hover{text-decoration:underline}
#drawer{position:fixed;top:0;right:0;width:min(560px,100vw);height:100vh;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);z-index:40;overflow:auto;padding:24px;display:none;flex-direction:column;gap:16px}
#drawer.on{display:flex}
#res{position:absolute;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);max-height:320px;overflow:auto;width:340px;right:0;top:42px;z-index:30;display:none}
#res div{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line2)}#res div:hover{background:#faf9f6}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.step{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px}.step b{display:block;font-size:13px}.step.h{background:#e8edf7;border-color:#c9d4e8}
.hide{display:none!important}
svg text{font-family:'Inter',system-ui,sans-serif}
@media(max-width:700px){header,main{padding-left:14px;padding-right:14px}.pers{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><b id="h-emp">Addi</b><span id="h-plan">Dashboard estratégico de TI</span></div>
    <div class="ctl" style="position:relative">
      <select id="f-pers" aria-label="Perspectiva"><option value="">Perspectiva: todas</option><option>Financiera</option><option>Cliente</option><option>Procesos internos</option><option>Aprendizaje y crecimiento</option></select>
      <select id="f-etq" aria-label="Tipo de dato"><option value="">Tipo de dato: todos</option><option>Real</option><option>Estimado</option><option>Simulado</option></select>
      <input id="q" type="search" placeholder="Buscar indicador o responsable" aria-label="Buscar" style="width:230px">
      <div id="res"></div>
      <button class="btn" id="b-av" title="Adelanta un mes el reloj simulado (flujo n8n)">Avanzar un mes ▸</button>
      <button class="btn" id="b-re" title="Vuelve al corte inicial">Reiniciar</button>
    </div>
  </div>
  <div class="meta" id="h-meta"></div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"><div class="card">Cargando datos…</div></main>
<aside id="drawer" aria-label="Detalle"></aside>

<script src="config.js"></script>
<script src="datos.js"></script>
<script>
"use strict";
const CFG = Object.assign({api: "http://localhost:5678/webhook/addi", timeout: 2500}, window.ADDI_CONFIG || {});
let D = null, VIVO = false, TAB = "General", SEL = null, IND = {}, COB = {};
const TABS = ["General", "Estrategia", "Datos", "Seguridad", "IA", "Operación", "COBIT"];
const TABN = {Estrategia: "Estrategia de TI"};
const COL = {verde: "#1a7f4b", amarillo: "#b7791f", rojo: "#c0392b", gris: "#8a9099"};
const SEMT = {verde: "● En meta", amarillo: "▲ En riesgo", rojo: "■ Fuera de meta", gris: "○ Sin dato"};
const NIV = ["#eef1f7", "#d5dff1", "#a9c0e6", "#6f95d6", "#3f6fc4", "#1e3a8a"], NIVT = ["#1f2328", "#1f2328", "#1f2328", "#fff", "#fff", "#fff"];
const NIVN = ["Incompleto", "Realizado", "Gestionado", "Establecido", "Predecible", "Optimizado"];
const DOMN = {EDM: "Evaluar, dirigir y monitorear", APO: "Alinear, planificar y organizar", BAI: "Construir, adquirir e implementar", DSS: "Entregar, dar servicio y soporte", MEA: "Monitorear, evaluar y valorar"};
const DOMS = Object.keys(DOMN);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = (v, d) => v == null ? "—" : Number(v).toLocaleString("es-CO", {maximumFractionDigits: d ?? (Math.abs(v) < 2 ? 3 : Math.abs(v) < 100 ? 2 : 1), minimumFractionDigits: 0});
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const tag = e => e ? `<span class="tag t-${e.split(" ")[0]}">${e}</span>` : "";
const evid = e => e ? `<span class="tag t-ev" title="V = verificado en fuente pública · I = inferido · NV = no verificable desde afuera">[${e}]</span>` : "";
const mes = s => { if (!s) return "—"; const [y, m] = s.split("-"); return ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"][m - 1] + " " + y; };
const sem = s => `<span class="sem" style="color:${COL[s] || COL.gris}">${SEMT[s] || SEMT.gris}</span>`;
const flecha = t => t === "sube" ? "↑ sube" : t === "baja" ? "↓ baja" : "→ estable";

/* ---------- carga ---------- */
async function cargar() {
  try {
    const c = new AbortController(); const t = setTimeout(() => c.abort(), CFG.timeout);
    const r = await fetch(CFG.api + "/dashboard", {signal: c.signal}); clearTimeout(t);
    if (!r.ok) throw new Error(r.status);
    let j = await r.json(); if (Array.isArray(j)) j = j[0]; if (j.data) j = j.data; if (typeof j === "string") j = JSON.parse(j);
    D = j; VIVO = true;
  } catch (e) { D = window.ADDI_SNAPSHOT; VIVO = false; }
  if (!D) { $("#main").innerHTML = `<div class="banner">No hay datos: falta <code>datos.js</code> y el flujo de n8n no responde en ${esc(CFG.api)}.</div>`; return; }
  IND = Object.fromEntries(D.indicadores.map(i => [i.id, i])); COB = Object.fromEntries(D.cobit.map(c => [c.codigo, c]));
  pintar();
}
async function post(ruta, cuerpo) {
  const r = await fetch(CFG.api + ruta, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(cuerpo)});
  let j = await r.json(); if (Array.isArray(j)) j = j[0]; if (j.data) j = j.data; if (j.r) j = j.r; return j;
}
let AVISO = "";
async function accion(ruta, cuerpo) {
  if (!VIVO) { AVISO = "Sin conexión con n8n: esta acción necesita el flujo activo."; pintar(); return; }
  try { const j = await post(ruta, cuerpo); AVISO = (j.ok ? "✔ " : "✖ ") + (j.mensaje || ""); } catch (e) { AVISO = "✖ No se pudo completar: " + e.message; }
  await cargar();
}

/* ---------- gráficas SVG ---------- */
function spark(i, w = 220, h = 44) {
  const s = (i.serie || []).slice(-24); if (s.length < 2) return "";
  const vs = s.map(x => +x[1]), m = i.estado?.meta, all = m != null && i.sentido !== "Rango" ? vs.concat(+m) : vs;
  let lo = Math.min(...all), hi = Math.max(...all); if (hi === lo) { hi += 1; lo -= 1; }
  const X = k => 2 + k * (w - 4) / (s.length - 1), Y = v => h - 4 - (v - lo) * (h - 8) / (hi - lo);
  const p = vs.map((v, k) => `${X(k).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const ml = m != null && i.sentido !== "Rango" ? `<line x1="2" x2="${w - 2}" y1="${Y(+m)}" y2="${Y(+m)}" stroke="#8a9099" stroke-dasharray="3 3"/>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Tendencia de 24 meses">${ml}<polyline points="${p}" fill="none" stroke="#1f5fbf" stroke-width="1.6"/><circle cx="${X(s.length - 1)}" cy="${Y(vs.at(-1))}" r="2.6" fill="#1f5fbf"/></svg>`;
}
function linea(series, o = {}) { // series: [{nombre, color, pts:[[periodo, valor]], dash}]
  const w = 520, h = 230, L = 46, R = 12, T = 12, B = 30, per = series[0].pts.map(p => p[0]);
  let vs = series.flatMap(s => s.pts.map(p => +p[1])); if (o.meta != null) vs.push(+o.meta); if (o.rango) vs.push(+o.rango[0], +o.rango[1]);
  let lo = Math.min(...vs), hi = Math.max(...vs); const pad = (hi - lo || 1) * .08; lo -= pad; hi += pad;
  const X = k => L + k * (w - L - R) / Math.max(1, per.length - 1), Y = v => T + (hi - v) * (h - T - B) / (hi - lo);
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ece9e2"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#5b616a">${fmt(v)}</text>`; }
  per.forEach((p, k) => { if (k % Math.ceil(per.length / 6) === 0) g += `<text x="${X(k)}" y="${h - 10}" text-anchor="middle" font-size="11" fill="#5b616a">${mes(p)}</text>`; });
  if (o.rango) g += `<rect x="${L}" width="${w - L - R}" y="${Y(o.rango[1])}" height="${Y(o.rango[0]) - Y(o.rango[1])}" fill="#1a7f4b" opacity=".08"/>`;
  if (o.meta != null) g += `<line x1="${L}" x2="${w - R}" y1="${Y(o.meta)}" y2="${Y(o.meta)}" stroke="#1f2328" stroke-dasharray="5 4"/><text x="${w - R}" y="${Y(o.meta) - 5}" text-anchor="end" font-size="11" fill="#1f2328">Meta ${fmt(o.meta)}</text>`;
  series.forEach(s => {
    g += `<polyline points="${s.pts.map((p, k) => `${X(k).toFixed(1)},${Y(+p[1]).toFixed(1)}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="1.8" ${s.dash ? 'stroke-dasharray="4 3"' : ""}/>`;
    g += s.pts.map((p, k) => `<circle cx="${X(k).toFixed(1)}" cy="${Y(+p[1]).toFixed(1)}" r="5" fill="transparent"><title>${mes(p[0])}: ${fmt(p[1])}${o.unidad ? " " + o.unidad : ""}${s.nombre ? " · " + s.nombre : ""}</title></circle>`).join("");
  });
  const ley = series.length > 1 ? `<div class="row" style="justify-content:flex-start;gap:14px">${series.map(s => `<span><span class="dot" style="background:${s.color}"></span> ${esc(s.nombre)}</span>`).join("")}</div>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(o.titulo || "Serie histórica")}">${g}</svg>${ley}`;
}
function radar(ejes, a, b) { // a = actual, b = objetivo (0 a 5)
  const cx = 150, cy = 130, R = 92, n = ejes.length, P = (k, v) => { const an = -Math.PI / 2 + k * 2 * Math.PI / n; return [cx + R * v / 5 * Math.cos(an), cy + R * v / 5 * Math.sin(an)]; };
  let g = ""; for (let l = 1; l <= 5; l++) g += `<polygon points="${ejes.map((_, k) => P(k, l).map(x => x.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#e4e1da"/>`;
  ejes.forEach((e, k) => { const [x, y] = P(k, 6.1); g += `<line x1="${cx}" y1="${cy}" x2="${P(k, 5)[0]}" y2="${P(k, 5)[1]}" stroke="#e4e1da"/><text x="${x}" y="${y}" text-anchor="middle" font-size="12" fill="#1f2328">${e} ${fmt(a[k], 2)}</text>`; });
  const pol = (v, c, f, d) => `<polygon points="${v.map((x, k) => P(k, x).map(t => t.toFixed(1)).join(",")).join(" ")}" fill="${f}" stroke="${c}" stroke-width="2" ${d ? 'stroke-dasharray="5 4"' : ""}/>`;
  return `<svg viewBox="0 0 300 262" width="100%" style="max-width:330px;align-self:center" role="img" aria-label="Radar de madurez por dominio: ${ejes.map((e, k) => e + " " + fmt(a[k], 2)).join("; ")}">${g}${pol(b, "#8a9099", "none", 1)}${pol(a, "#1f5fbf", "rgba(31,95,191,.15)")}</svg>
  <div class="row" style="justify-content:center;gap:16px"><span><span class="dot" style="background:#1f5fbf"></span> Nivel actual</span><span>┄ Nivel objetivo (S5, por aprobar)</span></div>`;
}
const barra = (v, max, meta, color) => `<div class="bar" role="img" aria-label="${fmt(v)} de ${fmt(max)}"><i style="width:${Math.max(0, Math.min(100, 100 * v / max))}%;${color ? "background:" + color : ""}"></i>${meta != null ? `<em style="left:${Math.min(100, 100 * meta / max)}%" title="Meta ${fmt(meta)}"></em>` : ""}</div>`;

/* ---------- piezas ---------- */
function filtra(i) {
  const fe = $("#f-etq").value, fp = $("#f-pers").value;
  if (fe && i.estado?.etiqueta !== fe) return false;
  if (fp) { const o = D.objetivos_bsc.find(o => o.codigo === i.objetivo_bsc); if (!o || o.perspectiva !== fp) return false; }
  return true;
}
function kpi(id) {
  const i = IND[id]; if (!i || !filtra(i)) return ""; const e = i.estado || {};
  const meta = i.sentido === "Rango" ? `Rango sano ${fmt(i.rango_min)} a ${fmt(i.rango_max)}` : `Meta ${fmt(e.meta)}`;
  return `<div class="card kpi" tabindex="0" data-ind="${esc(id)}"><div class="hd"><div class="n">${esc(i.nombre)}</div><div class="tags">${tag(e.etiqueta)}<span class="num">${i.elemento ? "#" + i.elemento : ""}${i.objetivo_bsc ? " " + i.id : ""}</span></div></div>
  <div><span class="v">${fmt(e.valor)}</span><span class="u">${esc(i.unidad)}</span></div>${spark(i)}
  <div class="row"><span>${meta}</span>${sem(e.semaforo)}</div><div class="row"><span>${flecha(e.tendencia)} · ${mes(e.periodo?.slice(0, 7))}</span><span>${i.tipo === "Leading" ? "Inductor" : "Resultado"}</span></div></div>`;
}
const kpis = ids => `<div class="grid g4">${ids.map(kpi).join("") || '<div class="note">Ningún indicador coincide con los filtros.</div>'}</div>`;
const seccion = (t, sub, cuerpo) => `<section class="sec"><h2>${t}</h2><div class="sub">${sub}</div>${cuerpo}</section>`;
const card = (t, d, etq, n, cuerpo) => `<div class="card"><div class="hd"><div><h3>${t}</h3><div class="d">${d || ""}</div></div><div class="tags">${tag(etq)}<span class="num">${n || ""}</span></div></div>${cuerpo}</div>`;
const prin = () => D.indicadores.filter(i => i.principal && i.estado);
const cuenta = (l, s) => l.filter(i => i.estado.semaforo === s).length;
const pend = () => D.propuestas.filter(p => p.estado === "pendiente");
const evaluados = () => D.cobit.filter(c => c.nivel != null);
const nivDom = d => avg(evaluados().filter(c => c.dominio === d).map(c => c.nivel));
const objDom = d => avg(evaluados().filter(c => c.dominio === d).map(c => c.nivel_objetivo));
const autoPts = () => D.autoevaluacion.reduce((a, x) => a + x.puntos, 0);
function autoNivel() { const pts = autoPts(), max = D.autoevaluacion.length * 2, pct = pts / max; let n = 0; for (let l = 5; l >= 1; l--) if (pct >= (l + 1) / 7 && !n) n = l; return {pts, max, pct, n, sig: Math.ceil((n + 2) / 7 * max)}; }

function tablaAlertas(l) {
  if (!l.length) return '<div class="note">Sin alertas activas en este corte.</div>';
  return `<div class="scroll"><table><thead><tr><th>Qué pasa</th><th>Impacto</th><th>Qué decidir</th><th>Responsable</th><th>Fecha límite</th><th>Dato</th></tr></thead><tbody>${l.map(a =>
    `<tr class="clk" data-ind="${esc(a.indicador)}"><td><b style="color:${COL.rojo}">■</b> ${esc(a.que_pasa)}</td><td>${esc(a.impacto)}</td><td>${esc(a.que_decidir)}</td><td>${esc(a.responsable)}</td><td style="white-space:nowrap">${esc(a.fecha_limite)}</td><td>${tag(a.etiqueta)}</td></tr>`).join("")}</tbody></table></div>`;

function vIA() {

  const dec = v("32") > .25 || v("31") < .74 ? "No" : falta.length ? "Con condiciones" : "Sí";
  const dm = {scoring: [dec, falta.join(" · ") || "Cumple las cuatro reglas"], antifraude: ["Con condiciones", "Sin métricas propias en el catálogo: falta su ficha"], llm: ["Con condiciones", "En piloto: falta política de uso aprobada (S-06)"]};
  const dc = {"Sí": COL.verde, "Con condiciones": COL.amarillo, "No": COL.rojo};
  const mods = `<div class="scroll"><table><thead><tr><th>Modelo</th><th>Riesgo</th><th>Estado</th><th>¿Puede salir a producción?</th><th>Qué le falta</th><th>Apagado rápido</th><th>Lo que NO tiene permitido</th><th>Dueño y revisión</th></tr></thead><tbody>${D.modelos_ia.map(m =>
    `<tr><td><b>${esc(m.nombre)}</b><div class="note">${esc(m.ancla)}</div></td><td>${m.riesgo}</td><td>${m.estado}</td><td><b style="color:${dc[dm[m.modelo_id][0]]}">${dm[m.modelo_id][0]}</b></td><td>${esc(dm[m.modelo_id][1])}</td><td>${m.apagado_rapido ? "Sí" : "No"}</td><td>${m.usos_no_permitidos.split(" · ").map(esc).join("<br>")}</td><td>${esc(m.dueno)}<div class="note">Revisión: ${m.proxima_revision}</div></td></tr>`).join("")}</tbody></table></div>
    <div class="note">Regla (#30): Sí si PSI &lt; 0,10, AUC ≥ 0,78, correcciones en rango y explicación ≥ 95 %. No si PSI &gt; 0,25 o AUC &lt; 0,74. En otro caso, con condiciones. Hereda la etiqueta «simulado».</div>`;
  const dims = ["38a", "38b", "38c", "38d"].map(id => IND[id]);

    seccion("Calidad de la evidencia y del aseguramiento", "Elementos 62 a 64", cob) +
    seccion("Autoevaluación y proyección", "Elementos 65 y 69", `<div class="grid g2">${card("Autoevaluación de madurez por sección", `${au.pts} de ${au.max} puntos · nivel ${au.n} · 31 preguntas`, "Estimado", "#65", auto)}${card("Madurez proyectada 2026 a 2030", "Si el plan se cumple: cada acción terminada sube 1 nivel su objetivo, con tope en el nivel objetivo", "Simulado", "#69", proy)}</div>`) +
    seccion("Cambios de nivel", "Elementos 70 y 71 · el flujo propone y una persona aprueba", `<div class="grid">${card("Cola de cambios propuestos", "Se muestran aparte de los niveles aprobados; mientras nadie responda, no se aplican", "Simulado", "#70", cola + (VIVO ? "" : '<div class="note">Modo sin conexión: para aprobar o rechazar, activa los flujos de n8n.</div>'))}
      ${card("Alertas del corte por objetivo", "No cambian el nivel", "", "#61, #67", `<div class="scroll"><table><tbody>${inf.map(p => `<tr class="clk" data-cob="${p.objetivo}"><td><b>${p.objetivo}</b> ${esc(p.nombre)}</td><td>${p.regla}</td><td>${esc(p.evidencia)}</td><td>${tag(p.etiqueta)}</td></tr>`).join("") || "<tr><td>Sin alertas</td></tr>"}</tbody></table></div>`)}
      ${card("Historial de cambios de nivel", "Cuándo cambió cada objetivo, quién lo decidió y con qué evidencia", "", "#71", hist)}</div>`) +
    seccion("Cómo funciona el flujo", "Flujo mensual en n8n · 7 pasos con aprobación humana", `<div class="card">${flujo}</div>`);
}

/* ---------- detalle de un indicador (sección C, elementos 12 a 18) ---------- */
let ANIO = null;
function detalle(id) {
  const i = IND[id]; if (!i) return; const e = i.estado || {}, dr = $("#drawer");
  const anios = Object.keys(i.metas || {}).filter(a => a >= 2027); if (!ANIO || !anios.includes(String(ANIO))) ANIO = null;
  const meta = ANIO ? i.metas[ANIO] : e.meta, serie = i.serie || [];
  const cum = ANIO && i.sentido !== "Rango" && e.valor != null ? (i.sentido === "Max" ? (meta > 0 ? Math.min(100, 100 * e.valor / meta) : 100) : (+e.valor <= meta ? 100 : meta > 0 ? 100 * meta / e.valor : 0)) : e.cumplimiento;
  const acc = (i.acciones || []).map(a => D.plan.find(p => p.codigo === a)), rs = (i.riesgos || []).map(r => D.riesgos.find(x => x.id === r));
  dr.innerHTML = `<div class="hd"><div><div class="num">${i.elemento ? "Elemento #" + i.elemento : "Indicador del BSC"}${i.objetivo_bsc ? " · " + i.id : ""} · pestaña ${TABN[i.pestana] || i.pestana}</div><h2 style="margin:4px 0;font-size:18px">${esc(i.nombre)}</h2></div><button class="btn sm" id="dr-x" aria-label="Cerrar">✕</button></div>
    <div class="grid" style="grid-template-columns:repeat(3,1fr)">
      <div><div class="d">Valor <span class="num">#12</span></div><b style="font-size:24px">${fmt(e.valor)}</b> <span class="num">${esc(i.unidad)}</span><div class="note">${mes(e.periodo?.slice(0, 7))} · ${flecha(e.tendencia)}</div></div>
      <div><div class="d">Meta <span class="num">#14</span></div><b style="font-size:24px">${i.sentido === "Rango" ? fmt(i.rango_min) + " a " + fmt(i.rango_max) : fmt(meta)}</b><div class="note">${ANIO ? "Meta de " + ANIO : "A la fecha del corte"}</div></div>
      <div><div class="d">Cumplimiento <span class="num">#12</span></div><b style="font-size:24px">${cum != null ? fmt(cum, 0) + " %" : "—"}</b><div>${ANIO ? "" : sem(e.semaforo)}</div></div></div>
    ${anios.length ? `<div class="ctl"><span class="d">Comparar contra la meta de:</span><button class="btn sm ${!ANIO ? "pri" : ""}" data-anio="">Corte</button>${anios.map(a => `<button class="btn sm ${ANIO == a ? "pri" : ""}" data-anio="${a}">${a}</button>`).join("")}</div>` : ""}
    <div><div class="row"><b style="color:var(--tx)">Gráfica histórica <span class="num">#13</span></b><span>${serie.length} meses hasta el corte ${i.reloj === "plan" ? "del plan" : "operativo"}</span></div>${serie.length > 1 ? linea([{color: "#1f5fbf", pts: serie}], {meta: i.sentido === "Rango" ? null : meta, rango: i.sentido === "Rango" ? [i.rango_min, i.rango_max] : null, unidad: i.unidad}) : '<div class="note">Sin serie histórica.</div>'}</div>
    <div class="row" style="color:var(--tx)"><span><b>Etiqueta del dato</b> <span class="num">#17</span></span><span>${tag(e.etiqueta)} <span class="num">clase ${i.clase}${i.clase === 1 ? " · derivado del equipo" : i.clase === 2 ? " · anclado en un hecho público" : " · simulado con semilla"}</span></span></div>
    ${i.sentido === "Rango" ? `<div class="row" style="color:var(--tx)"><span><b>Rango sano</b> <span class="num">#15</span></span><span>Ideal entre ${fmt(i.rango_min)} y ${fmt(i.rango_max)} ${esc(i.unidad)}</span></div>` : i.umbral_rojo != null ? `<div class="row" style="color:var(--tx)"><span><b>Umbral de alerta</b> <span class="num">#15</span></span><span>${i.sentido === "Max" ? "Menor que" : "Mayor que"} ${fmt(i.umbral_rojo)} ${esc(i.unidad)}</span></div>` : ""}
    <div class="card" style="padding:14px;gap:6px"><b>Ficha del indicador <span class="num">#16</span></b>
      <div><span class="d">Qué mide:</span> ${esc(i.que_mide)}</div><div><span class="d">Cómo se calcula:</span> ${esc(i.formula)}</div><div><span class="d">Ancla:</span> ${esc(i.ancla)}</div>
      <div><span class="d">Ruido (σ):</span> ${esc(i.sigma)} · <span class="d">Sentido:</span> ${i.sentido === "Max" ? "mayor es mejor" : i.sentido === "Min" ? "menor es mejor" : "dentro del rango"} · <span class="d">Tipo:</span> ${i.tipo === "Leading" ? "inductor" : "resultado"}</div>
      <div><span class="d">Responsable:</span> ${esc(i.responsable)} · <span class="d">Fuente:</span> ${esc(i.fuente)}</div>
      <div><span class="d">Metas:</span> ${Object.entries(i.metas || {}).map(([a, m]) => `${a == 2026 ? "base" : a}: ${fmt(m)}`).join(" · ") || "—"}</div></div>
    <div class="card" style="padding:14px;gap:6px"><b>Conexiones <span class="num">#18</span></b>
      <div><span class="d">Objetivo del BSC:</span> ${i.objetivo_bsc ? i.objetivo_bsc + " · " + esc(D.objetivos_bsc.find(o => o.codigo === i.objetivo_bsc).nombre) : "—"}</div>
      <div><span class="d">Acción del plan:</span> ${acc.map(a => `<b>${a.codigo}</b> ${esc(a.accion)} (${a.fase})`).join(" · ") || "Ninguna ligada"}</div>
      <div><span class="d">Riesgo:</span> ${rs.map(r => `<b>${r.id}</b> ${esc(r.riesgo)}`).join(" · ") || "Ninguno ligado"}</div>
      <div><span class="d">Objetivo COBIT:</span> ${(i.cobit || []).map(c => `<b>${c}</b> ${esc(COB[c].nombre)}`).join(" · ") || "—"}</div></div>
    ${e.etiqueta === "Simulado" ? '<div class="banner">Dato simulado: no es un dato de Addi. Demuestra la lógica del tablero (semáforos, alertas, tendencias y metas).</div>' : ""}`;
  dr.classList.add("on"); dr.dataset.id = id;
}

/* ---------- marco ---------- */
function pintar() {
  const c = D.config, P = prin(), dias = Math.floor((new Date(D.consultado || Date.now()) - new Date(D.generado)) / 864e5), viejo = dias > +c.dias_vigencia;
  $("#h-emp").textContent = c.empresa; $("#h-plan").textContent = c.periodo_plan + " · Dashboard estratégico de TI";
  $("#h-meta").innerHTML = `<span>Corte operativo: <b style="color:var(--tx)">${mes(c.corte_operativo.slice(0, 7))}</b></span><span>Corte del plan: <b style="color:var(--tx)">${mes(c.corte_plan.slice(0, 7))}</b> (simulado)</span>
    <span title="${esc(c.documento_fuente)}">Fuente: ${esc(c.documento_fuente)}</span>
    <span style="color:${viejo ? COL.rojo : COL.verde};font-weight:600">${viejo ? "■ Datos desactualizados" : "● Datos al día"} <span style="font-weight:400;color:var(--mut)">(generados hace ${dias} días · parámetros ${esc(c.version_parametros)})</span></span>
    <span class="cnt" title="Indicadores fuera de meta"><span class="dot" style="background:${COL.rojo}"></span>${cuenta(P, "rojo")}</span><span class="cnt" title="Indicadores en riesgo"><span class="dot" style="background:${COL.amarillo}"></span>${cuenta(P, "amarillo")}</span><span class="cnt" title="Indicadores en meta"><span class="dot" style="background:${COL.verde}"></span>${cuenta(P, "verde")}</span>
    <span>${VIVO ? "● Conectado a n8n" : "○ Sin conexión: copia local"}</span>`;
  $("#tabs").innerHTML = TABS.map(t => `<button class="tab ${t === TAB ? "on" : ""}" data-tab="${t}">${TABN[t] || t}${t === "COBIT" && pend().length ? `<span class="badge">${pend().length}</span>` : ""}</button>`).join("");
  $("#b-av").disabled = $("#b-re").disabled = !VIVO;
  const v = {General: vGeneral, Estrategia: vEstrategia, Datos: vDatos, Seguridad: vSeguridad, IA: vIA, "Operación": vOperacion, COBIT: vCobit}[TAB]();
  $("#main").innerHTML = (AVISO ? `<div class="banner ${AVISO.startsWith("✔") ? "ok" : ""}">${esc(AVISO)}</div>` : "") +
    (VIVO ? "" : `<div class="banner">Modo sin conexión: se muestra la copia local de los datos (<code>datos.js</code>). Para avanzar el reloj y aprobar cambios, activa los flujos de n8n en ${esc(CFG.api)}.</div>`) + v +
    `<div class="note">Regla del tablero: todo dato lleva su etiqueta (real, estimado o simulado). Los valores simulados no son datos de Addi: existen para demostrar la lógica del tablero. Una cifra calculada hereda la etiqueta menos sólida de sus insumos. Equipo Nexus · Gobernanza y Servicios de TI.</div>`;
  if ($("#drawer").classList.contains("on")) detalle($("#drawer").dataset.id);
}
document.addEventListener("click", ev => {
  const t = ev.target, q = s => t.closest(s);
  if (q("#dr-x")) { $("#drawer").classList.remove("on"); return; }
  if (q("[data-anio]")) { ANIO = q("[data-anio]").dataset.anio || null; detalle($("#drawer").dataset.id); return; }
  if (q("[data-dec]")) { const b = q("[data-dec]"), id = b.dataset.id, ap = document.querySelector(`[data-ap="${id}"]`).value.trim(), mo = document.querySelector(`[data-mo="${id}"]`).value.trim();
    try { localStorage.setItem("addi_aprobador", ap); } catch (e) {}
    accion("/decision", {id: +id, decision: b.dataset.dec, aprobador: ap, motivo: mo}); return; }
  if (t.matches("input,select")) return;
  if (q("[data-tab]")) { TAB = q("[data-tab]").dataset.tab; AVISO = ""; pintar(); window.scrollTo(0, 0); return; }
  if (q("[data-cob]")) { SEL = q("[data-cob]").dataset.cob; if (TAB !== "COBIT") TAB = "COBIT"; pintar(); $("#det-cob")?.scrollIntoView({behavior: "smooth", block: "center"}); return; }
  if (q("[data-ind]")) { ANIO = null; detalle(q("[data-ind]").dataset.ind); $("#res").style.display = "none"; return; }
  if (q("#b-av")) return accion("/corte", {accion: "avanzar"});
  if (q("#b-re")) return accion("/corte", {accion: "reiniciar"});
  if (!q("#drawer") && !q("#q")) $("#res").style.display = "none";
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#drawer").classList.remove("on"); if (e.key === "Enter" && e.target.matches(".kpi")) detalle(e.target.dataset.ind); });
$("#f-etq").onchange = $("#f-pers").onchange = () => pintar();
$("#q").oninput = e => { const s = e.target.value.trim().toLowerCase(), r = $("#res"); if (s.length < 2) { r.style.display = "none"; return; }
  const l = D.indicadores.filter(i => i.principal && (i.nombre.toLowerCase().includes(s) || i.responsable.toLowerCase().includes(s) || i.id.toLowerCase() === s)).slice(0, 12);
  r.innerHTML = l.map(i => `<div data-ind="${i.id}"><span class="dot" style="background:${COL[i.estado?.semaforo] || COL.gris}"></span> ${esc(i.nombre)}<br><span class="num">${esc(i.responsable)} · ${TABN[i.pestana] || i.pestana}</span></div>`).join("") || '<div>Sin resultados</div>'; r.style.display = "block"; };
cargar();
</script>
</body>
</html>
